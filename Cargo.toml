[workspace]
resolver = "2"
members = [
    "src-tauri",
    "opide-sandbox",
    "crates/opide-bridge",
    "crates/opide-shell",
    "crates/opide-ai",
    "crates/opide-engine",
]

# Workspace metadata for feature flags — OPIDE Performance Refactor v2.0
[workspace.metadata.features]
default = ["full"]
lite = ["opide-engine/lite", "opide-ai/lite", "opide-shell/lite"]
full = ["engram", "mcp", "vault", "dream", "ast-index"]

# Shared dependency versions — members use `dep.workspace = true`
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
