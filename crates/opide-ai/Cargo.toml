[package]
name = "opide-ai"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "OPIDE AI — AST indexer, WASM skill registry, tool executor, diff editor, embeddings"

[dependencies]
# Workspace shared
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
uuid.workspace = true
async-trait.workspace = true

# Tauri (for commands, AppHandle, State, Emitter, Manager)
tauri = { version = "2", features = [] }

# OPIDE engine (types, traits, EngineState)
opide-engine = { path = "../opide-engine", default-features = false }

# OPIDE Shell (ide_mcp, git — used by tool executor)
opide-shell = { path = "../opide-shell" }

# OPIDE Sandbox (WASM + JS execution)
opide-sandbox = { path = "../../opide-sandbox" }

# AST parsing
tree-sitter = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-css = { version = "0.23", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-go = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.23", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
solang-parser = { version = "0.3", optional = true }

# Utilities
dirs = "5"
regex = "1"
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"

# Feature flags para Performance Refactor v2.0
[features]
default = ["full"]
full = ["ast-index", "embeddings"]
lite = []  # Sem AST indexing pesado, sem embeddings
ast-index = ["tree-sitter", "tree-sitter-typescript", "tree-sitter-javascript",
             "tree-sitter-rust", "tree-sitter-python", "tree-sitter-css",
             "tree-sitter-json", "tree-sitter-go", "tree-sitter-c",
             "tree-sitter-cpp", "tree-sitter-java", "tree-sitter-ruby",
             "solang-parser"]
embeddings = []
